<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haircut Studio - Reportes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================================
     MOCKUP: Exportación de Reportes (R.14)
============================================================= -->

<header class="site">
<div class="container">
<h1>Haircut<span class="accent-dot">.</span>Studio <small>Admin</small></h1>
<div class="view-switch">
<a href="index.html">Cliente</a> ·
<a href="admin-dashboard.html" class="current">Administrador</a>
</div>
</div>
</header>

<nav class="main-nav">
<div class="container">
<a href="admin-dashboard.html">Panel</a>
<a href="admin-disponibilidad.html">Disponibilidad</a>
<a href="admin-solicitudes.html">Solicitudes</a>
<a href="admin-reportes.html" class="current">Reportes</a>
</div>
</nav>

<main>
<div class="container">

<section class="card">
<h2>Reportes de Trabajo Mensual</h2>

<form action="#" method="get">
<div class="field">
<label for="mes">Selecciona mes</label>
<select id="mes" name="mes">
<option>Enero 2026</option>
<option>Febrero 2026</option>
<option selected>Agosto 2026</option>
<option>Septiembre 2026</option>
</select>
</div>

<div class="actions">
<button type="submit" formaction="reporte.pdf" class="btn-primary">Descargar PDF</button>
<button type="submit" formaction="reporte.xlsx" class="btn-secondary">Descargar planilla (Excel)</button>
</div>
</form>

<p class="hint">El reporte incluye todas las reservas confirmadas, canceladas y rechazadas del mes seleccionado,
para efectos de auditoría y organización interna.</p>
</section>

</div>
</main>

<footer class="site">
<div class="container">
<p>Haircut Studio &mdash; Reportes</p>
</div>
</footer>

</body>
</html>
