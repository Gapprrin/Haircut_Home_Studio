<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1350" viewBox="0 0 1900 1350" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de clases de la vista lógica de Haircut Home Studio</title>
  <desc id="desc">Clases principales del dominio: Usuario, Reserva, Servicio, Categoría, Producto, Generación IA y configuración de disponibilidad.</desc>
  <defs>
    <style>
      .title{font:600 30px Arial,sans-serif;fill:#17202a}.subtitle{font:17px Arial,sans-serif;fill:#52606d}
      .classBox{fill:#fff;stroke:#34495e;stroke-width:2.2}.classHead{fill:#eaf0f5;stroke:#34495e;stroke-width:2.2}.aiHead{fill:#eeeafd}.configHead{fill:#e9f5ee}
      .className{font:600 21px Arial,sans-serif;fill:#17202a;text-anchor:middle}.stereo{font:italic 14px Arial,sans-serif;fill:#52606d;text-anchor:middle}
      .member{font:16px Consolas,'Courier New',monospace;fill:#1f2933}.method{font:16px Consolas,'Courier New',monospace;fill:#263238}
      .assoc{stroke:#455a64;stroke-width:2;fill:none}.mult{font:600 16px Arial,sans-serif;fill:#17202a}.role{font:italic 14px Arial,sans-serif;fill:#52606d;text-anchor:middle}
      .note{font:italic 14px Arial,sans-serif;fill:#52606d;text-anchor:middle}
    </style>
  </defs>
  <rect width="1900" height="1350" fill="white"/>
  <text x="950" y="42" class="title" text-anchor="middle">Diagrama de clases — Vista lógica</text>
  <text x="950" y="72" class="subtitle" text-anchor="middle">Haircut Home Studio</text>

  <!-- Usuario -->
  <g>
    <rect x="60" y="135" width="330" height="335" class="classBox"/>
    <rect x="60" y="135" width="330" height="66" class="classHead"/>
    <text x="225" y="163" class="stereo">«entidad»</text><text x="225" y="188" class="className">Usuario</text>
    <line x1="60" y1="201" x2="390" y2="201" class="assoc"/>
    <text x="78" y="230" class="member">+ id: Entero</text><text x="78" y="255" class="member">+ nombre: Texto</text>
    <text x="78" y="280" class="member">+ email: Texto</text><text x="78" y="305" class="member">- contraseña: Texto</text>
    <text x="78" y="330" class="member">+ rol: RolUsuario</text><text x="78" y="355" class="member">+ esInvitado: Booleano</text>
    <line x1="60" y1="375" x2="390" y2="375" class="assoc"/>
    <text x="78" y="405" class="method">+ esAdmin(): Booleano</text><text x="78" y="430" class="method">+ esPeluquero(): Booleano</text>
    <text x="78" y="455" class="method">+ esStaff(): Booleano</text>
  </g>

  <!-- Reserva -->
  <g>
    <rect x="540" y="115" width="390" height="380" class="classBox"/>
    <rect x="540" y="115" width="390" height="66" class="classHead"/>
    <text x="735" y="143" class="stereo">«entidad»</text><text x="735" y="168" class="className">Reserva</text>
    <line x1="540" y1="181" x2="930" y2="181" class="assoc"/>
    <text x="558" y="210" class="member">+ id: Entero</text><text x="558" y="235" class="member">+ fecha: Fecha</text>
    <text x="558" y="260" class="member">+ hora: Hora</text><text x="558" y="285" class="member">+ lugar: LugarAtencion</text>
    <text x="558" y="310" class="member">+ estado: EstadoReserva</text><text x="558" y="335" class="member">+ foto: Ruta [0..1]</text>
    <text x="558" y="360" class="member">+ creadoEn: FechaHora</text>
    <line x1="540" y1="383" x2="930" y2="383" class="assoc"/>
    <text x="558" y="415" class="method">+ puedeCancelar(): Booleano</text>
  </g>

  <!-- Servicio -->
  <g>
    <rect x="1080" y="125" width="355" height="350" class="classBox"/>
    <rect x="1080" y="125" width="355" height="66" class="classHead"/>
    <text x="1257" y="153" class="stereo">«entidad»</text><text x="1257" y="178" class="className">Servicio</text>
    <line x1="1080" y1="191" x2="1435" y2="191" class="assoc"/>
    <text x="1098" y="220" class="member">+ id: Entero</text><text x="1098" y="245" class="member">+ nombre: Texto</text>
    <text x="1098" y="270" class="member">+ descripción: Texto</text><text x="1098" y="295" class="member">+ duraciónMin: Entero</text>
    <text x="1098" y="320" class="member">+ precio: Decimal</text><text x="1098" y="345" class="member">+ imagen: Ruta [0..1]</text>
    <text x="1098" y="370" class="member">+ activo: Booleano</text>
  </g>

  <!-- Categoria -->
  <g>
    <rect x="1550" y="155" width="285" height="255" class="classBox"/>
    <rect x="1550" y="155" width="285" height="66" class="classHead"/>
    <text x="1692" y="183" class="stereo">«entidad»</text><text x="1692" y="208" class="className">Categoría</text>
    <line x1="1550" y1="221" x2="1835" y2="221" class="assoc"/>
    <text x="1568" y="253" class="member">+ id: Entero</text><text x="1568" y="280" class="member">+ nombre: Texto</text>
    <text x="1568" y="307" class="member">+ slug: Texto</text><text x="1568" y="334" class="member">+ imagen: Ruta [0..1]</text>
  </g>

  <!-- Generacion IA -->
  <g>
    <rect x="385" y="650" width="430" height="380" class="classBox"/>
    <rect x="385" y="650" width="430" height="66" class="classHead aiHead"/>
    <text x="600" y="678" class="stereo">«entidad»</text><text x="600" y="703" class="className">GeneraciónIA</text>
    <line x1="385" y1="716" x2="815" y2="716" class="assoc"/>
    <text x="403" y="745" class="member">+ id: Entero</text><text x="403" y="770" class="member">+ preset: Texto</text>
    <text x="403" y="795" class="member">- rutaEntrada: Ruta [0..1]</text><text x="403" y="820" class="member">- rutaResultado: Ruta [0..1]</text>
    <text x="403" y="845" class="member">+ estado: EstadoGeneración</text><text x="403" y="870" class="member">+ completadaEn: FechaHora [0..1]</text>
    <text x="403" y="895" class="member">+ expiraEn: FechaHora</text><text x="403" y="920" class="member">+ códigoError: Texto [0..1]</text>
    <line x1="385" y1="943" x2="815" y2="943" class="assoc"/>
    <text x="403" y="975" class="method">+ estáLista(): Booleano</text>
  </g>

  <!-- Producto -->
  <g>
    <rect x="1515" y="620" width="320" height="320" class="classBox"/>
    <rect x="1515" y="620" width="320" height="66" class="classHead"/>
    <text x="1675" y="648" class="stereo">«entidad»</text><text x="1675" y="673" class="className">Producto</text>
    <line x1="1515" y1="686" x2="1835" y2="686" class="assoc"/>
    <text x="1533" y="715" class="member">+ id: Entero</text><text x="1533" y="740" class="member">+ nombre: Texto</text>
    <text x="1533" y="765" class="member">+ descripción: Texto</text><text x="1533" y="790" class="member">+ precio: Decimal</text>
    <text x="1533" y="815" class="member">+ imagen: Ruta [0..1]</text><text x="1533" y="840" class="member">+ activo: Booleano</text>
    <text x="1533" y="865" class="member">+ orden: Entero</text>
  </g>

  <!-- Configuracion -->
  <g>
    <rect x="950" y="715" width="360" height="250" class="classBox"/>
    <rect x="950" y="715" width="360" height="66" class="classHead configHead"/>
    <text x="1130" y="743" class="stereo">«configuración»</text><text x="1130" y="768" class="className">ConfiguraciónAgenda</text>
    <line x1="950" y1="781" x2="1310" y2="781" class="assoc"/>
    <text x="968" y="813" class="member">+ id: Entero</text><text x="968" y="840" class="member">+ horaInicio: Hora</text>
    <text x="968" y="867" class="member">+ horaFin: Hora</text><text x="968" y="894" class="member">+ díasAtención: Lista&lt;Día&gt;</text>
  </g>

  <!-- Dia no disponible -->
  <g>
    <rect x="900" y="1100" width="300" height="165" class="classBox"/>
    <rect x="900" y="1100" width="300" height="62" class="classHead configHead"/>
    <text x="1050" y="1126" class="stereo">«entidad»</text><text x="1050" y="1150" class="className">DíaNoDisponible</text>
    <line x1="900" y1="1162" x2="1200" y2="1162" class="assoc"/>
    <text x="918" y="1195" class="member">+ id: Entero</text><text x="918" y="1223" class="member">+ fecha: Fecha</text>
  </g>

  <!-- Mes visible -->
  <g>
    <rect x="1260" y="1100" width="290" height="190" class="classBox"/>
    <rect x="1260" y="1100" width="290" height="62" class="classHead configHead"/>
    <text x="1405" y="1126" class="stereo">«entidad»</text><text x="1405" y="1150" class="className">MesVisible</text>
    <line x1="1260" y1="1162" x2="1550" y2="1162" class="assoc"/>
    <text x="1278" y="1195" class="member">+ id: Entero</text><text x="1278" y="1223" class="member">+ año: Entero</text>
    <text x="1278" y="1251" class="member">+ mes: Entero</text>
  </g>

  <!-- Asociaciones principales -->
  <path d="M390 290 H540" class="assoc"/><text x="402" y="281" class="mult">1</text><text x="512" y="281" class="mult">0..*</text><text x="465" y="315" class="role">realiza</text>
  <path d="M930 290 H1080" class="assoc"/><text x="942" y="281" class="mult">0..*</text><text x="1057" y="281" class="mult">1</text><text x="1005" y="315" class="role">corresponde a</text>
  <path d="M1435 280 H1550" class="assoc"/><text x="1447" y="271" class="mult">0..*</text><text x="1525" y="271" class="mult">1</text><text x="1492" y="305" class="role">clasifica</text>

  <path d="M225 470 V570 H480 V650" class="assoc"/><text x="238" y="492" class="mult">1</text><text x="452" y="640" class="mult">0..*</text><text x="336" y="558" class="role">solicita</text>
  <path d="M735 495 V650" class="assoc"/><text x="748" y="522" class="mult">0..1</text><text x="748" y="640" class="mult">0..1</text><text x="685" y="580" class="role">usa</text>
  <path d="M1257 475 V565 H720 V650" class="assoc"/><text x="1270" y="505" class="mult">1</text><text x="732" y="640" class="mult">0..*</text><text x="980" y="553" class="role">simula</text>

  <path d="M1692 410 V620" class="assoc"/><text x="1705" y="438" class="mult">1</text><text x="1705" y="610" class="mult">0..*</text><text x="1755" y="520" class="role">agrupa</text>
  <path d="M1130 965 V1050 H1050 V1100" class="assoc"/><text x="1143" y="992" class="mult">1</text><text x="1065" y="1090" class="mult">0..*</text><text x="1040" y="1040" class="role">bloquea</text>
  <path d="M1160 965 V1030 H1405 V1100" class="assoc"/><text x="1173" y="992" class="mult">1</text><text x="1418" y="1090" class="mult">0..*</text><text x="1290" y="1020" class="role">habilita</text>

  <text x="950" y="1328" class="note">Se muestran las clases del dominio y sus relaciones; las clases internas de Laravel se omiten por no aportar a la comprensión lógica del negocio.</text>
</svg>
