<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de secuencia: crear solicitud de reserva</title>
  <desc id="desc">Interacción entre cliente, interfaz de reserva, ReservationController, AvailabilityService y base de datos, con vinculación opcional de una simulación de IA ya generada.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#202124"/></marker>
    <marker id="openArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M1,0 L9,4 L1,8" fill="none" stroke="#202124" stroke-width="1.4"/></marker>
    <style>
      .title { font: 600 28px Arial, sans-serif; fill:#1f2937; }
      .subtitle { font: 16px Arial, sans-serif; fill:#4b5563; }
      .head { fill:#edf2f7; stroke:#334155; stroke-width:2; }
      .headtext { font: 600 18px Arial, sans-serif; fill:#111827; text-anchor:middle; }
      .life { stroke:#64748b; stroke-width:1.4; stroke-dasharray:7 6; }
      .msg { stroke:#202124; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
      .return { stroke:#475569; stroke-width:1.4; stroke-dasharray:6 5; fill:none; marker-end:url(#openArrow); }
      .label { font: 16px Arial, sans-serif; fill:#111827; text-anchor:middle; }
      .small { font: 14px Arial, sans-serif; fill:#111827; text-anchor:middle; }
      .note { font: italic 14px Arial, sans-serif; fill:#475569; text-anchor:middle; }
      .activation { fill:#cbd5e1; stroke:#334155; stroke-width:1.3; }
      .frame { fill:#f8fafc; stroke:#64748b; stroke-width:1.4; }
      .framehead { font:600 15px Arial, sans-serif; fill:#334155; }
      .divider { stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:5 5; }
    </style>
  </defs>

  <rect width="1600" height="1320" fill="white"/>
  <text x="800" y="42" class="title" text-anchor="middle">Diagrama de secuencia — Crear solicitud de reserva</text>
  <text x="800" y="70" class="subtitle" text-anchor="middle">Vista lógica · Haircut Home Studio</text>

  <g>
    <rect x="65" y="100" width="170" height="56" rx="3" class="head"/><text x="150" y="134" class="headtext">Cliente</text>
    <rect x="330" y="100" width="240" height="56" rx="3" class="head"/><text x="450" y="126" class="headtext">Interfaz de</text><text x="450" y="146" class="headtext">reserva</text>
    <rect x="630" y="100" width="240" height="56" rx="3" class="head"/><text x="750" y="126" class="headtext">Reservation</text><text x="750" y="146" class="headtext">Controller</text>
    <rect x="920" y="100" width="240" height="56" rx="3" class="head"/><text x="1040" y="126" class="headtext">Availability</text><text x="1040" y="146" class="headtext">Service</text>
    <rect x="1210" y="100" width="220" height="56" rx="3" class="head"/><text x="1320" y="134" class="headtext">Base de datos</text>
  </g>
  <g class="life"><path d="M150 156 V1265"/><path d="M450 156 V1265"/><path d="M750 156 V1265"/><path d="M1040 156 V1265"/><path d="M1320 156 V1265"/></g>

  <path d="M150 205 H450" class="msg"/><text x="300" y="195" class="label">1. Seleccionar servicio y fecha</text>
  <rect x="443" y="205" width="14" height="75" class="activation"/>
  <path d="M450 250 H750" class="msg"/><text x="600" y="240" class="label">2. Solicitar horarios disponibles</text>
  <rect x="743" y="250" width="14" height="120" class="activation"/>
  <path d="M750 294 H1040" class="msg"/><text x="895" y="284" class="label">3. slotsDisponibles(fecha, servicio)</text>
  <rect x="1033" y="294" width="14" height="118" class="activation"/>
  <path d="M1040 338 H1320" class="msg"/><text x="1180" y="328" class="label">4. Consultar configuración y reservas</text>
  <rect x="1313" y="338" width="14" height="38" class="activation"/>
  <path d="M1320 382 H1040" class="return"/><text x="1180" y="402" class="label">Datos de disponibilidad</text>
  <path d="M1040 425 H750" class="return"/><text x="895" y="445" class="label">Horarios disponibles</text>
  <path d="M750 470 H450" class="return"/><text x="600" y="490" class="label">Mostrar calendario y horarios</text>

  <path d="M150 540 H450" class="msg"/><text x="300" y="530" class="label">5. Elegir hora, lugar y confirmar</text>
  <path d="M450 585 H750" class="msg"/><text x="600" y="575" class="label">6. Enviar solicitud de reserva</text>
  <rect x="743" y="585" width="14" height="575" class="activation"/>
  <path d="M750 630 H750" class="msg"/><text x="855" y="624" class="small">7. Validar datos ingresados</text>
  <path d="M750 675 H1040" class="msg"/><text x="895" y="665" class="label">8. Verificar disponibilidad</text>
  <rect x="1033" y="675" width="14" height="115" class="activation"/>
  <path d="M1040 720 H1320" class="msg"/><text x="1180" y="710" class="label">9. Consultar reservas del día</text>
  <rect x="1313" y="720" width="14" height="38" class="activation"/>
  <path d="M1320 764 H1040" class="return"/><text x="1180" y="784" class="label">Reservas existentes</text>
  <path d="M1040 805 H750" class="return"/><text x="895" y="825" class="label">Resultado de disponibilidad</text>

  <rect x="610" y="850" width="770" height="320" class="frame"/>
  <text x="620" y="874" class="framehead">alt [horario disponible]</text>
  <rect x="635" y="892" width="720" height="92" fill="none" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="646" y="914" class="framehead">opt [cliente seleccionó simulación de IA ya generada]</text>
  <path d="M750 938 H1320" class="msg"/><text x="1035" y="928" class="label">10. Validar simulación: propietario, servicio, estado y vigencia</text>
  <path d="M1320 960 H750" class="return"/><text x="1035" y="978" class="label">Simulación válida</text>
  <path d="M750 1025 H1320" class="msg"/><text x="1035" y="1015" class="label">11. Crear reserva (estado: pendiente)</text>
  <rect x="1313" y="1025" width="14" height="42" class="activation"/>
  <path d="M1320 1073 H750" class="return"/><text x="1035" y="1093" class="label">Reserva registrada</text>
  <path d="M750 1125 H450" class="return"/><text x="600" y="1145" class="label">12. Confirmar envío de solicitud</text>
  <path d="M450 1180 H150" class="return"/><text x="300" y="1200" class="label">Mostrar reserva pendiente</text>

  <rect x="100" y="1230" width="1400" height="48" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="800" y="1260" class="note">La generación de IA es un caso de uso independiente; aquí solo se vincula una simulación previamente completada.</text>
</svg>
